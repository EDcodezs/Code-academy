<html>
<head>
    <title>My Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        p {
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>

    <div>
        <h2>My Form</h2>

        <form action="sender.php" method="POST">

            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname">

            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname">

            <label for="age">Age:</label>
            <input type="text" id="age" name="age">

            <label for="gender">gender:</label>
            <input type="text" id="gender" name="gender">

            <label for="height">height:</label>
            <input type="text" id="height" name="height">

            <label for="nationality">Last name:</label>
            <input type="text" id="nationality" name="nationality">

            <label for="likes">likes:</label>
            <input type="text" id="likes" name="likes">

            <label for="dislikes">dislikes:</label>
            <input type="text" id="dislikes" name="dislikes">

            <label for="favouriteMeal">favouriteMeal:</label>
            <input type="text" id="favouriteMeal" name="favouriteMeal">

            <label for="favouriteHoliday">favouriteHoliday:</label>
            <input type="text" id="favouriteHoliday" name="favouriteHoliday">

            <input type="submit" value="Submit">

        </form>

        <p>Enter your details and click Submit.</p>
    </div>

</body>
</html>
