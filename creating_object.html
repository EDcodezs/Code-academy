<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Objects</h1>
<h2>Creating an Object</h2>

<p id="demo"></p>

<script>
// Create an Object:
const student = {
 firstName: "Enioluwa",
 lastName: "Dada",
 fullName: function() {
 return this.firstName + " " + this.lastName;
 }
};


// Display Data from the Object:
document.getElementById("demo").innerHTML = "The name of one of the students is " + student.fullName();
</script>

</body>
</html>
